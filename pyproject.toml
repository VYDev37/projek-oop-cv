[project]
name = "projek-oop"
version = "0.1.0"
description = "Sistem AI Image Analysis & Tagging Otomatis [I2]"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.0.0",
    "pydantic>=2.10.0",
    "pillow>=10.0.0",
    "streamlit>=1.40.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["traffic_system_backup", ".venv", "data"]
